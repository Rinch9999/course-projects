# MySQL 连接（本地演示）；无 MySQL 时可用 H2 内嵌：jdbc:h2:mem:property;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/property?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=your_mysql_password

# MyBatis 映射文件位置
mybatis.mapper-locations=classpath:mapper/*.xml

# 下划线列名 → 驼峰属性自动映射（owner_id → ownerId，created_at → createdAt）
mybatis.configuration.map-underscore-to-camel-case=true

# Nacos 服务注册与发现（演示版）。
# 默认 false：不依赖 Nacos server，单机 `mvn spring-boot:run` 即可跑通；
# 要演示微服务注册：先把下面 enabled 改 true，再启动本地 Nacos（默认 8848 端口），
# 即可在 Nacos 控制台看到本服务，/api/discovery/services 也会返回服务清单。
spring.application.name=property-service
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.discovery.server-addr=localhost:8848
